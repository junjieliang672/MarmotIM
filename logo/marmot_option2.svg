<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
  <!-- Option 2: Minimalist marmot - rounder, cuter -->
  <!-- Head background -->
  <circle cx="9" cy="10" r="7" fill="#D4A853"/>
  <!-- Inner face -->
  <ellipse cx="9" cy="11" rx="4.5" ry="4" fill="#F5E6C4"/>
  <!-- Ears -->
  <circle cx="3.5" cy="5" r="2" fill="#D4A853"/>
  <circle cx="14.5" cy="5" r="2" fill="#D4A853"/>
  <circle cx="3.5" cy="5" r="1" fill="#F5C4C4"/>
  <circle cx="14.5" cy="5" r="1" fill="#F5C4C4"/>
  <!-- Eyes - dot style -->
  <circle cx="6.5" cy="9" r="1.2" fill="#333"/>
  <circle cx="11.5" cy="9" r="1.2" fill="#333"/>
  <!-- Blush -->
  <ellipse cx="5" cy="11" rx="1.5" ry="0.8" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="13" cy="11" rx="1.5" ry="0.8" fill="#FFB6C1" opacity="0.6"/>
  <!-- Nose -->
  <ellipse cx="9" cy="11.5" rx="1" ry="0.7" fill="#8B5A2B"/>
  <!-- Mouth -->
  <path d="M7.5 13 Q9 14.5 10.5 13" stroke="#8B5A2B" stroke-width="0.6" fill="none"/>
  <!-- Two front teeth -->
  <rect x="8" y="13" width="0.8" height="1.2" rx="0.2" fill="#FFF"/>
  <rect x="9.2" y="13" width="0.8" height="1.2" rx="0.2" fill="#FFF"/>
</svg>