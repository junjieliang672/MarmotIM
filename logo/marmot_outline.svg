<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
  <!-- Hand-drawn outline marmot face for Terminal Hybrid theme -->
  <!-- Uses currentColor for automatic light/dark adaptation -->

  <!-- Head outline -->
  <ellipse cx="9" cy="10" rx="7" ry="6.5" fill="none" stroke="currentColor" stroke-width="1.2"/>

  <!-- Ears -->
  <ellipse cx="4" cy="5" rx="2" ry="1.5" fill="none" stroke="currentColor" stroke-width="1"/>
  <ellipse cx="14" cy="5" rx="2" ry="1.5" fill="none" stroke="currentColor" stroke-width="1"/>

  <!-- Cheeks (subtle inner circles) -->
  <circle cx="4" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
  <circle cx="14" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>

  <!-- Eyes -->
  <circle cx="6.5" cy="9" r="1.3" fill="currentColor"/>
  <circle cx="11.5" cy="9" r="1.3" fill="currentColor"/>

  <!-- Nose -->
  <ellipse cx="9" cy="12" rx="1.3" ry="0.9" fill="none" stroke="currentColor" stroke-width="1"/>

  <!-- Teeth -->
  <rect x="8" y="13.5" width="2" height="1.8" rx="0.3" fill="none" stroke="currentColor" stroke-width="0.8"/>
  <line x1="9" y1="13.5" x2="9" y2="15.3" stroke="currentColor" stroke-width="0.6"/>
</svg>
