<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
  <!-- Option 4: Kawaii style marmot - extra cute -->
  <!-- Body/head merged (chibi style) -->
  <ellipse cx="9" cy="10" rx="7.5" ry="7" fill="#CD853F"/>
  <!-- Belly -->
  <ellipse cx="9" cy="12" rx="4" ry="3.5" fill="#FFEFD5"/>
  <!-- Ears -->
  <ellipse cx="3" cy="4" rx="2.2" ry="2" fill="#CD853F"/>
  <ellipse cx="15" cy="4" rx="2.2" ry="2" fill="#CD853F"/>
  <ellipse cx="3" cy="4" rx="1.2" ry="1" fill="#FFB6C1"/>
  <ellipse cx="15" cy="4" rx="1.2" ry="1" fill="#FFB6C1"/>
  <!-- Big sparkly eyes -->
  <ellipse cx="6" cy="9" rx="2" ry="2.2" fill="#1a1a1a"/>
  <ellipse cx="12" cy="9" rx="2" ry="2.2" fill="#1a1a1a"/>
  <!-- Eye sparkles -->
  <circle cx="6.8" cy="8.3" r="0.8" fill="#FFF"/>
  <circle cx="5.5" cy="9.5" r="0.4" fill="#FFF"/>
  <circle cx="12.8" cy="8.3" r="0.8" fill="#FFF"/>
  <circle cx="11.5" cy="9.5" r="0.4" fill="#FFF"/>
  <!-- Rosy cheeks -->
  <ellipse cx="3.5" cy="11" rx="1.5" ry="1" fill="#FF9999" opacity="0.5"/>
  <ellipse cx="14.5" cy="11" rx="1.5" ry="1" fill="#FF9999" opacity="0.5"/>
  <!-- Tiny nose -->
  <ellipse cx="9" cy="11.5" rx="0.8" ry="0.5" fill="#8B4513"/>
  <!-- Cute smile with teeth -->
  <path d="M7 13 Q9 15 11 13" stroke="#8B4513" stroke-width="0.5" fill="none"/>
  <rect x="8.2" y="13" width="0.7" height="1" rx="0.2" fill="#FFF"/>
  <rect x="9.1" y="13" width="0.7" height="1" rx="0.2" fill="#FFF"/>
</svg>