name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build app
        run: |
          xcodebuild \
            -project MarmotIM.xcodeproj \
            -scheme MarmotIM \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release" \
            build

          if [ ! -d "build/Release/MarmotIM.app" ]; then
            echo "Error: Build failed"
            exit 1
          fi
          echo "Build succeeded"

      - name: Create release package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/MarmotIM

          # Copy app
          cp -R build/Release/MarmotIM.app dist/MarmotIM/

          # Create install script
          cat > dist/MarmotIM/install.sh << 'EOF'
          #!/bin/bash
          set -e
          cd "$(dirname "$0")"
          echo "Installing MarmotIM..."
          xattr -cr MarmotIM.app 2>/dev/null || true
          chmod +x MarmotIM.app/Contents/MacOS/MarmotIM
          if pgrep -f MarmotIM > /dev/null 2>&1; then
            killall MarmotIM 2>/dev/null || true
            sleep 1
          fi
          sudo rm -rf "/Library/Input Methods/MarmotIM.app"
          sudo cp -r MarmotIM.app "/Library/Input Methods/"
          sudo codesign --force --deep --sign - "/Library/Input Methods/MarmotIM.app"
          open "/Library/Input Methods/MarmotIM.app"
          echo "Done! Add MarmotIM in System Settings > Keyboard > Input Sources"
          EOF
          chmod +x dist/MarmotIM/install.sh

          # Create README
          cat > dist/MarmotIM/README.txt << 'EOF'
          MarmotIM Installation
          =====================
          1. Open Terminal, cd to this folder
          2. Run: bash install.sh
          3. Add MarmotIM in System Settings > Keyboard > Input Sources

          Dictionary Setup (Required):
          - Clone repo: git clone https://github.com/junjieliang672/MarmotIM.git
          - Run: python3 tools/build_dictionary.py --pinyin vocab/py_table.txt --wubi vocab/wb_table.txt --extra-pinyin-dir vocab --output dict --skip-json --install
          EOF

          # Create zip
          cd dist
          zip -r "MarmotIM-v${VERSION}.zip" MarmotIM
          rm -rf MarmotIM

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarmotIM-${{ steps.version.outputs.version }}
          path: dist/*.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
